<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales &amp; Demand Forecasting</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>📈 Sales &amp; Demand Forecasting</h1>
    <p>Upload historical sales data or use the sample dataset to generate a business-ready forecast.</p>
  </header>

  <main>
    <section class="card controls">
      <div class="control-row">
        <label for="fileInput">Upload CSV (date, sales)</label>
        <input type="file" id="fileInput" accept=".csv" />
      </div>
      <div class="control-row">
        <label for="horizon">Forecast horizon (periods)</label>
        <input type="number" id="horizon" value="8" min="1" max="52" />
      </div>
      <div class="control-row buttons">
        <button id="loadSampleBtn">Load Sample Data</button>
        <button id="forecastBtn" class="primary">Run Forecast</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="card">
      <h2>Forecast Chart</h2>
      <canvas id="forecastChart" height="110"></canvas>
    </section>

    <section class="card metrics" id="metricsSection" style="display:none;">
      <h2>Model Evaluation</h2>
      <div class="metrics-grid" id="metricsGrid"></div>
      <p id="bestModel" class="best-model"></p>
    </section>

    <section class="card">
      <h2>Forecast Table</h2>
      <table id="forecastTable">
        <thead><tr><th>Date</th><th>Forecasted Value</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Task 1 · Sales &amp; Demand Forecasting for Businesses</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
